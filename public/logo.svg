  <path d="M26 8C27.5 9.2 29 9.8 31 9.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.25" stroke-linecap="round" />
  <path d="M28 11.5C29.2 12.4 30.5 12.8 32 12.6" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.25" stroke-linecap="round" />

  <!-- Envelope body -->
  <path d="M9.5 14C9.5 12.6193 10.6193 11.5 12 11.5H28C29.3807 11.5 30.5 12.6193 30.5 14V26C30.5 27.3807 29.3807 28.5 28 28.5H12C10.6193 28.5 9.5 27.3807 9.5 26V14Z" fill="#FFFFFF" fill-opacity="0.08" stroke="url(#pm-accent-grad)" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Envelope fold flap -->
  <path d="M10 12.5L20 20.5L30 12.5" stroke="url(#pm-accent-grad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Postmark seal ring -->
