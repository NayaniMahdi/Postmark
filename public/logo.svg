      <stop offset="0%" stop-color="#252422" />
      <stop offset="55%" stop-color="#3B1E24" />
      <stop offset="100%" stop-color="#803D46" />
    </linearGradient>
    <linearGradient id="pm-stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#803D46" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="pm-accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E9D7CE" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Squircle base -->
  <rect x="1" y="1" width="38" height="38" rx="10" fill="url(#pm-bg-grad)" stroke="url(#pm-stroke-grad)" stroke-width="1" />

